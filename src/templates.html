<template id="vimuser-sidebar-menu">
  <!-- Mirrors the site's own filter sections (classes copied from them) so it
       sits inside the filter card identically to "Kategorien", "Preis", … -->
  <section class="vimuser-menu mt-small border-t border-utilityNonessential pt-small">
    <header>
      <h3 class="font-strong">Filter</h3>
    </header>
    <div class="mt-medium">
      <textarea rows="10"
        class="box-border w-full rounded-medium border border-solid border-utility bg-surface p-small text-bodyRegular focus:outline-none"
        placeholder="Suchbegriffe zum Rausfiltern hier eintragen.

Beispiele:
porzellan
kinderschuhe
bücher"
      ></textarea>
      <div class="mt-small">
        <button type="button"
          class="vimuser-menu-button inline-flex h-xlarge cursor-pointer items-center rounded-full bg-interactive px-medium font-strong text-onInteractive hover:bg-interactiveContainer">
          Speichern
        </button>
      </div>
      <div class="mt-small">
        <a class="text-secondary underline hover:no-underline"
          href="https://chromewebstore.google.com/detail/kleinanzeigende-filter/bekmapfnlkhaeopdmhglkanoobnglbhf">
          Über den Filter
        </a>
      </div>
    </div>
  </section>
</template>

<template id="vimuser-stub">
  <button class="vimuser-stub vimuser-hidden"></button>
</template>

<template id="vimuser-fold-button">
  <button type="button"
    class="vimuser-fold-button bg-interactive text-onInteractive hover:bg-interactiveContainer cursor-pointer font-strong">
    Ausblenden
  </button>
</template>
